# Dependency updates.
#
# - GitHub Actions: keeps the full-SHA pins in .github/workflows current.
# - npm (pnpm, from pnpm-lock.yaml): one weekly PR with minor and patch updates grouped;
#   majors separately (TypeScript 7 is held back:
#   `astro check` and Astro's TypeScript tooling support only 6).
# - Cooldown matches pnpm-workspace.yaml's minimumReleaseAge (3 days). CI installs with the
#   frozen lockfile, so pnpm's trust and build-script policies apply to every PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 14
    versioning-strategy: increase
    open-pull-requests-limit: 5
    ignore:
      # Types follow the lowest supported Node major (engines.node >=22), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
